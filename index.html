<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f11">
  <meta name="description" content="친구와 실시간으로 즐기는 한국어 끝말잇기 게임, WORDLINK">
  <title>WORDLINK — 단어를 잇는 재미</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/client.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="/" aria-label="WORDLINK 홈">
      <span class="brand-mark">W<span></span></span>
      <span class="brand-name">WORDLINK</span>
      <span class="brand-version">BETA 0.1</span>
    </a>
    <div class="topbar-right">
      <span class="server-status"><i id="connection-dot"></i><span id="connection-label">서버 연결 중</span></span>
      <span class="topbar-tag">PLAY TOGETHER</span>
    </div>
  </header>

  <main id="app" class="app-shell">
    <div class="loading-screen"><div class="loading-spinner"></div><p>게임을 준비하고 있어요</p></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer class="site-footer">
    <span>WORDLINK <span class="footer-dot">·</span> 친구와 이어 가는 단어</span>
    <span>독립 개발 프로젝트 <span class="footer-dot">·</span> v0.1.0</span>
  </footer>
</body>
</html>
