<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#86d957">
  <meta name="description" content="친구와 실시간으로 즐기는 한국어 끝말잇기 게임, WORDLINK">
  <title>WORDLINK — 단어를 잇는 재미</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/client.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="/" aria-label="WORDLINK 홈">
      <span class="brand-mark">W<span></span></span>
      <span class="brand-name">WORDLINK</span>
      <span class="brand-version">BETA 0.2</span>
    </a>
    <div class="topbar-right">
      <span class="server-status"><i id="connection-dot"></i><span id="connection-label">서버 연결 중</span></span>
      <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true" aria-label="효과음 켜짐 (누르면 끄기)" title="효과음">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/>
          <path class="icon-waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
          <path class="icon-mute" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
        <span class="sound-label">효과음</span><span id="sound-state" class="sound-state">ON</span>
      </button>
      <span class="topbar-tag">친구와 함께</span>
    </div>
  </header>

  <main id="app" class="app-shell">
    <div class="loading-screen"><div class="loading-spinner"></div><p>게임을 준비하고 있어요</p></div>
  </main>

  <div id="reaction-layer" class="reaction-layer" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer class="site-footer">
    <span>WORDLINK <span class="footer-dot">·</span> 친구와 이어 가는 단어</span>
    <span>독립 개발 프로젝트 <span class="footer-dot">·</span> v0.2.0</span>
  </footer>
</body>
</html>
